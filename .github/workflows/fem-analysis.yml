name: FEM Analysis

on:
  push:
    branches:
      - main
    paths-ignore:
      - "results/**"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-fem:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run FEM solver
        run: python src/bar_1d.py

      - name: Generate FEM plots
        run: python src/visualize_bar.py

      - name: Commit updated result figures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add results/

          if git diff --cached --quiet; then
            echo "No changes in FEM results."
          else
            git commit -m "Update generated FEM results"
            git push
          fi
