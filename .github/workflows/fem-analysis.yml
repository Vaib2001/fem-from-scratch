name: FEM Analysis

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  run-fem:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run 1D FEM solver
        run: python src/bar_1d.py

      - name: Generate FEM plots
        run: python src/visualize_bar.py

      - name: Upload FEM results
        uses: actions/upload-artifact@v4
        with:
          name: fem-results
          path: results/
